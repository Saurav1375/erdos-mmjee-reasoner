# Base configuration. Relative paths resolve against the project root.
paths:
  artifacts: artifacts            # all generated data (dataset export, generations, KB, models, eval)
  upstream_repo: third_party/mmJEE-Eval   # base-paper repo, git submodule (scoring notebooks)
  report: report
  hf_dataset: ArkaMukherjee/mmJEE-Eval

seed: 1234

data:
  # Years in the HF dataset: 2019-2026. SOP: train/dev = 2019-2024, test = 2025.
  # 2026 (added to HF after the paper) is excluded by decision.
  train_years: [2019, 2020, 2021, 2022, 2023, 2024]
  test_years: [2025]
  exclude_years: [2026]
  expected_counts: {train: 1270, test: 190}
  # Grid step used to expand range golds ("8.70 TO 9.10") into acceptable_values.
  range_grid_step: 0.001

# Pilot subset (`--pilot`): fixed, stratified by EN/HI twin pairs; outputs get a ".pilot" suffix.
pilot:
  test_pairs: 20       # 2025 twin pairs (40 questions), stratified by question type
  train_pairs: 75      # 2019-2024 twin pairs (~150 questions), stratified by year

# Default sampling for the substrate (Qwen3-VL Instruct recommended settings).
sampling:
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  presence_penalty: 0.0
  max_tokens: 4096        # total generation budget per trajectory

# Module A: code sandbox / program-of-thoughts
sandbox:
  timeout_s: 10
  memory_mb: 1024
  max_output_chars: 2000
  max_code_blocks: 3       # executed code blocks per trajectory
  force_answer: false      # budget forcing; pilot A/B: 21.9% vs 30.0% for the SOP CoT fallback -> off
  max_turns: 8             # generation calls per trajectory (safety bound)
  workers: 4               # parallel code executions (lab RAM is 15 GB; 8 added memory pressure)
  allowed_imports: [math, cmath, fractions, decimal, itertools, functools, statistics,
                    sympy, numpy, scipy, collections, operator]

# Module B: agentic iterative correction
correction:
  max_rounds: 3            # R: critic rounds per chain
  unchanged_patience: 2    # stop when the answer is unchanged this many consecutive rounds
  critic_sampling: {temperature: 0.0, top_p: 1.0, top_k: -1, max_tokens: 1536}

# Module C: learned verifier
verifier:
  embedding_model: BAAI/bge-small-en-v1.5
  embedding_tail_chars: 2000   # embed the last N characters of a solution (reasoning tail + answer)
  pca_dims: 32                 # embedding PCA dims (fit on train only)
  cv_folds: 5
  dev_year: 2024               # model selection: CV on 2019-2023, dev = 2024, refit on 2019-2024
  models: [logreg, xgboost]
  feature_sets: [handcrafted, embedding, all]
  primary: {model: xgboost, feature_set: all, selection: max_prob}   # overwritten by dev choice

# Module D: retrieval-augmented exemplar prompting
rag:
  embedding_model: BAAI/bge-small-en-v1.5
  top_k: 2
  threshold: auto              # auto = tuned on 2024 queries vs 2019-2023 KB (see rag/retrieve.py)
  proxy_precision_target: 0.7
  same_subject_only: true
  dedup_threshold: 0.90        # drop KB entries whose transcript cosine to any 2025 transcript >= this
  max_solution_chars: 3000
  tag_sampling: {temperature: 0.0, top_p: 1.0, top_k: -1, max_tokens: 160}
  transcribe_sampling: {temperature: 0.0, top_p: 1.0, top_k: -1, max_tokens: 1536}

# Evaluation
eval:
  bootstrap: 2000
  sc_max_samples: 16           # CoT samples generated by default (more if matched compute needs it)
  # SOP Table I. Each row names how its numbers are computed (see pipeline/evaluate.py).
  table1:
    - {row: "Baseline (single-pass CoT)", kind: mean, exp: cot}
    - {row: "Self-consistency (matched compute)", kind: sc_matched, exp: cot, match: full}
    - {row: "+ Code sandbox", kind: mean, exp: pot}
    - {row: "+ Agentic correction (same-model critic)", kind: mean, exp: pot_corr_same}
    - {row: "+ Agentic correction (cross-model critic)", kind: mean, exp: pot_corr_cross}
    - {row: "+ Learned verifier", kind: verifier, exp: pot_corr_cross}
    - {row: "+ Retrieval (RAG)", kind: verifier, exp: full}
    - {row: "Full framework", kind: verifier, exp: full}
