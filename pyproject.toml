[project]
name = "mmjee-reasoner"
version = "0.1.0"
description = "Inference-time reasoning framework (code sandbox, agentic correction, learned verifier, RAG) around a frozen VLM on mmJEE-Eval"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
    { name = "Arpit Kumar", email = "arpitk@iitbhilai.ac.in" },
    { name = "Saurav Gupta", email = "sauravg@iitbhilai.ac.in" },
]
dependencies = [
    "datasets>=3.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "sympy>=1.13",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "matplotlib>=3.9",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# GPU inference (lab PC only). vLLM pins its own torch / transformers versions.
gpu = ["vllm>=0.11.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
mmjee = "mmjee_reasoner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmjee_reasoner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "dataset: tests that need the downloaded mmJEE-Eval dataset (artifacts/data)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Verbatim upstream code is kept byte-identical and is not linted.
extend-exclude = ["src/mmjee_reasoner/scoring/upstream.py"]
